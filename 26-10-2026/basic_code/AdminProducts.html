
<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="index.css">
    <title>Admin</title>
</head>
<body>
    <div class="admin">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Admin</h2>

            <div  class="sidebar-upper">
                <p><a href="./admin.html" class="link">Dashboard</a></p> <br>
                <p><a href="./AdminProducts.html" class="link">Products</a></p> <br>
               <p><a href="./profile.html" class="link">Profile</a></p>
            </div>

            <div class="sidebar-bottom">

        </div>

        <!-- Main Dashboard -->
        <div class="main-content">
 <h2>Products</h2>
            <!-- Count Boxes -->
            <div class="count">
                <div class="box">
                    <p>Categories</p>
                    <p>Count</p>
                </div>

                <div class="box">
                    <p>Products</p>
                    <p>Count</p>

            <!-- Product Management -->
            <section class="manage">
                <div class="align">
                    <h3>Product Management</h3>
                    <button class="add"><a href="./productForm.html">Add Product</a></button>
                </div>

                <div class="details">
                    <img src="" alt="Product">
                    <p>Product Name</p>
                    <p>Price</p>
                    <button class="edit" onclick=" update(id)">Edit</button>
                    <button class="del" onclick="deleted(id)">Delete</button>
                </div>
            </section>
        </div>

    </div>
      <script src="./config.js"></script>
