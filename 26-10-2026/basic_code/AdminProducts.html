
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Admin Products</title>
</head>
<body>
    <div class="admin">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Admin</h2>

            <div  class="sidebar-upper">
                <p><a href="./Admin.html" class="link">Dashboard</a></p> <br>
                <p><a href="./AdminProducts.html" class="link">Products</a></p> <br>
               <p><a href="./profile.html" class="link">Profile</a></p>
            </div>

            <div class="sidebar-bottom">
                <p><a href="./index.html" class="link">View Shop</a></p>
                <p><a href="./login.html" class="link">Log out</a></p>
            </div>
        </div>

        <!-- Main Dashboard -->
<div class="main-content">
    <h2>Products</h2>
    <!-- Count Boxes -->
    <div class="count">
        <div class="box">
            <p>Categories</p>
            <p id="categoryCount">0</p>
        </div>
        <div class="box">
            <p>Products</p>
            <p id="productCount">0</p>
        </div>
    </div>

    <!-- Product Management -->
    <section class="manage">

        <div class="align">
            <h3>Product Management</h3>

            <button class="add">
                <a href="./productForm.html">Add Product</a>
            </button>
        </div>

       <!-- Dynamic products -->

<div id="adminProductList"></div>

<template id="adminProductTemplate">
    <div class="admin-product-row">

        <img class="admin-product-img" src="" alt="Product">

        <h4 class="admin-product-name"></h4>

        <p class="admin-product-category"></p>

        <p class="admin-product-price"></p>

        <div class="product-actions">
            <button type="button" class="edit-product">Edit</button>
            <button type="button" class="delete-product">Delete</button>
        </div>

    </div>
</template>


    </section>

</div>

    </div>
      <script src="./config.js"></script>
    <script src="./script.js"></script>
</body>
</html>
