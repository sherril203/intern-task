<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Admin</title>
</head>

<body>
    <div class="admin">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Admin</h2>

            <div class="sidebar-upper">
                <p><a href="./admin.html" class="link">Dashboard</a></p> <br>
                <p><a href="./AdminProducts.html" class="link">Products</a></p> <br>
                <p><a href="./profile.html" class="link">Profile</a></p>
            </div>

            <div class="sidebar-bottom">
                <p><a href="./index.html" class="link">View Shop</a></p>
                <p><a href="./login.html" class="link">Log out</a></p>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div class="main-content">
            <form class="formdata"  onsubmit="post(e)" enctype="multipart/form-data">
                <p style="display: flex; justify-content: center; font-weight: bold;">post Products</p>
                <div>
                    <label for="">Image</label>
                    <input type="file" id="image" name="image">
                </div>
                <div>
                    <label for="">Product name</label>
                    <input  type="text" id="product_title">
                </div>
                <div>
                    <label for="">Category</label>
                    <input type="text" id="category">
                </div>
                <div>
                    <label for="">Price</label> <br>
                    <input type="text" id="price">
                </div>
                <div>
                    <label for=""> Original Price</label> <br>
                    <input type="text" id="original_price">
                </div>
                <div>
                    <label for="">Brand</label> <br>
                    <input type="text" id="brand">
                </div>
                <div>
                    <button class="form-submit" type="submit">Post</button>
                </div>
            </form>


        </div>

    </div>
        <script src="./config.js"></script>
    <script src="./script.js"></script>
</body>

</html>
