                ProductWorld
            </a>

    <ul>

    <div style="display:flex;align-items:center;gap:20px;">

            Cart (<span id="cartCount">0</span>)

        <!-- Login Button -->
        <button id="authBtn" onclick="handleAuth()">
            <i class="fa-regular fa-circle-user"></i>

        <!-- Hamburger -->

</nav>
   <div class="section">
    <p  style="font-weight: bold;font-size: 25px;">Contact Us</p>
   </div>
   <div class="contact-flex">
<div class="form">
    <p  style="font-weight: bold;font-size: 30px;">Get in touch</p>
        <div>
            <label for="" style="font-weight: bold;font-size: 20px;">Email</label> <br>
            <p>productworld@gmail.com</p>
        </div>
        <div>
            <label for=""  style="font-weight: bold;font-size: 20px;">Mobile No</label> <br>
            <p>+91 1234567890</p>
        </div>
        <div>
            <label for="" style="font-weight: bold;font-size: 20px;">Address</label> <br>
           <p>No:25,street road,aaa.</p>        
        </div>
    </div>
   <div class="form">
    <form id="contactForm">
        <div>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" required>
        </div>

        <div>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="message">Message</label><br>
            <textarea id="message" name="message" required></textarea>
        </div>

        <div>
            <button type="submit" class="form-submit">Submit</button>
        </div>
    </form>
</div>
   </div>
     <div class="footer">
           <p style="font-weight: bold;">ProductWorld</p> 
           <p>Purchase and enjoy</p>
           <p> 2026 All rights reserved</p>
        </div>

<script src="script.js"></script>
