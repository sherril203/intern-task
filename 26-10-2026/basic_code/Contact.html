<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
      <nav class="navbar">
        <div style="display:flex;justify-content: center; align-items: center;gap: 10px;">
            <img src="./logo/favicon.ico" alt="">
           <p style="font-family:cursive; font-weight: bold; "><a href="index.html" class="link" style="color:black">ProductWorld</a></p>
        </div>
    <ul >
        <li class="list"><a href="index.html"  class="link">Home</a></li>
        <li class="list"><a href="Products.html"  class="link">Products</a></li>
        <li class="list"><a href="Contact.html" class="link" style="text-decoration-line: underline; text-decoration-color: orange;">Contact</a></li>
    </ul>
     <div>
        <button class="adminbtn" onclick="openAdmin()" style="display: flex;justify-content: center; align-items: center; gap:10px;"> <i class="fa-regular fa-circle-user"></i> Admin</button>
    </div>
   </nav>
   <div class="section">
    <p  style="font-weight: bold;font-size: 25px;">Contact Us</p>
   </div>
   <div class="contact-flex">
<div class="form">
    <p  style="font-weight: bold;font-size: 30px;">Get in touch</p>
        <div>
            <label for="" style="font-weight: bold;font-size: 20px;">Email</label> <br>
            <p>productworld@gmail.com</p>
        </div>
        <div>
            <label for=""  style="font-weight: bold;font-size: 20px;">Mobile No</label> <br>
            <p>+91 1234567890</p>
        </div>
        <div>
            <label for="" style="font-weight: bold;font-size: 20px;">Address</label> <br>
           <p>No:25,street road,aaa.</p>        
        </div>
    </div>
   <div class="form">
    <form id="contactForm">
        <div>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" required>
        </div>

        <div>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="message">Message</label><br>
            <textarea id="message" name="message" required></textarea>
        </div>

        <div>
            <button type="submit" class="form-submit">Submit</button>
        </div>
    </form>
</div>
   </div>
     <div class="footer">
           <p style="font-weight: bold;">ProductWorld</p> 
           <p>Purchase and enjoy</p>
           <p> 2026 All rights reserved</p>
        </div>
        <script src="config.js"></script>
<script src="script.js"></script>
   <script src="https://kit.fontawesome.com/8872bf04b0.js" crossorigin="anonymous"></script>

</html>
