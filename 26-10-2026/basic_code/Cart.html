<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/ico" href="./logo/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Cart</title>
</head>

<body>

<nav class="navbar">

    <div style="display:flex;justify-content:center;align-items:center;gap:10px;">
        <img src="./logo/favicon.ico" alt="">
        <p style="font-family:cursive;font-weight:bold;">
            <a href="index.html" class="link" style="color:black">
                ProductWorld
            </a>
        </p>
    </div>

    <ul>
        <li class="list">
            <a href="index.html" class="link">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </li>

        <li class="list">
            <a href="Products.html" class="link">
                <i class="fa-solid fa-basket-shopping"></i> Products
            </a>
        </li>

        <li class="list">
            <a href="Contact.html" class="link">
                <i class="fa-solid fa-comments"></i> Contact
            </a>
        </li>
    </ul>

    <div style="display:flex;align-items:center;gap:20px;">

        <!-- Cart -->
        <a href="Cart.html" class="link">
            <i class="fa-solid fa-cart-shopping"></i>
            Cart (<span id="cartCount">0</span>)
        </a>

        <!-- Login Button -->
        <button id="authBtn" onclick="handleAuth()">
            <i class="fa-regular fa-circle-user"></i>
            <span id="authText">Login</span>
        </button>

        <!-- Hamburger -->
        <div class="menu-container" id="menuContainer" style="display:none;">

            <button type="button" id="menuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="dropdown-menu" id="dropdownMenu">

                <a href="MyOrders.html">
                    <i class="fa-solid fa-box"></i> My Orders
                </a>

                <a href="Cart.html">
                    <i class="fa-solid fa-cart-shopping"></i> My Cart
                </a>

                <a href="User.html">
                    <i class="fa-solid fa-user"></i> Profile
                </a>

                <a href="login.html" onclick="logoutUser(event)">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>

            </div>
        </div>

    </div>
</nav>

    <div class="main">
        <div>
            <p style="font-weight: bold;font-size:30px ">Cart</p>
            <p style="font-size:20px ">save and purchase</p>
        </div>
    </div>

<div class="cart-layout">

    <!-- LEFT SIDE: PRODUCTS -->
    <div class="product-container">

        <div id="productList"></div>

        <template id="cartTemplate">
            <div class="cart-item">

                <img src="" alt="Product">

                <div class="cart-details">

                    <p class="category"></p>

                    <h3 class="title"></h3>

                    <p class="price"></p>

                    <div class="cart-btn">

                        <button class="cart" type="button">
                            <i class="fa-solid fa-trash"></i>
                            Remove Cart
                        </button>

                        <button class="buy" type="button">
                            <i class="fa-solid fa-basket-shopping"></i>
                            Buy Now
                        </button>

                    </div>

                </div>
            </div>
        </template>

    </div>

    <!-- RIGHT SIDE: CHECKOUT -->
    <div class="cart-summary">

        <h3>Checkout</h3>

        <p>No. of Items: <span id="totalItems">0</span></p>

        <p>Total: <span id="totalPrice">₹0</span></p>

        <button class="buy" id="checkoutBtn" type="button">
            Proceed to Checkout
        </button>
<div class="recently-removed">
    <h3>Recently Cart</h3>

    <div id="removedProducts">
        <p class="empty-removed">
            No recently cart products
        </p>
    </div>
</div>
    </div>

</div>
    <div class="footer">
        <p style="font-weight: bold;">ProductWorld</p>
        <p>Purchase and enjoy</p>
        <p> 2026 All rights reserved</p>
    </div>
  <script src="./config.js"></script>
<script src="./script.js"></script>
<script src="https://kit.fontawesome.com/8872bf04b0.js" crossorigin="anonymous"></script>
</body>

</html>
