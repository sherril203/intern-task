<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/ico" href="./logo/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Products</title>
</head>

<body>

    <nav class="navbar">
        <div style="display:flex;justify-content: center; align-items: center;gap: 10px;">
            <img src="./logo/favicon.ico" alt="">
            <p style="font-family:cursive; font-weight: bold;"><a href="index.html" class="link"
                    style="color:black">ProductWorld</a></p>
        </div>

        <ul>
            <li class="list"><a href="index.html" class="link">Home</a></li>
            <li class="list"><a href="Products.html" class="link">Products</a></li>
            <li class="list"><a href="Contact.html" class="link">Contact</a></li>
        </ul>
        <div>
           <p><a href="./Cart.html" class="link" style="color:black"><i class="fa-solid fa-cart-shopping"></i> Cart(<span id="cartCount">0</span>)</a></p>
        </div>
    </nav>

    <div class="main">
        <div>
            <p style="font-weight: bold;font-size:30px ">Cart</p>
            <p style="font-size:20px ">save and purchase</p>
        </div>
    </div>

    <div class="filter-products">
<div class="product-container">
      <div style="display:flex;justify-content: center;gap:10px">
            <input type="text" class="input" placeholder="Search products..." id="searchInput">
            <button class="search" id="searchBtn">Search</button>
        </div>
<div id="productList"></div>

<template id="cartTemplate">
    <div class="cart-item">
        <img src="" alt="Product">

        <div class="cart-details">
            <p class="category"></p>
            <h3 class="title"></h3>
            <p class="price"></p>
<div style="display: flex;justify-content: center;gap: 3px;">
    <button class="cart" type="button">Remove Cart</button>
            <button class="buy" type="button">Buy Now</button>
</div>
            
        </div>
    </div>
</template>
</div>
    </div>
    <div class="footer">
        <p style="font-weight: bold;">ProductWorld</p>
        <p>Purchase and enjoy</p>
        <p> 2026 All rights reserved</p>
    </div>
  <script src="./config.js"></script>
<script src="./script.js"></script>
