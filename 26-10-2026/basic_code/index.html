<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/ico" href="./logo/favicon.ico">

    <title>ProductWorld</title>
</head>

<body>

    <!-- Navbar -->
<nav class="navbar">

    <div style="display:flex;justify-content:center;align-items:center;gap:10px;">
        <img src="./logo/favicon.ico" alt="">
        <p style="font-family:cursive;font-weight:bold;">
            <a href="index.html" class="link" style="color:black">
                ProductWorld
            </a>
        </p>
    </div>

    <ul>
        <li class="list">
            <a href="index.html" class="link">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </li>

        <li class="list">
            <a href="Products.html" class="link">
                <i class="fa-solid fa-basket-shopping"></i> Products
            </a>
        </li>

        <li class="list">
            <a href="Contact.html" class="link">
                <i class="fa-solid fa-comments"></i> Contact
            </a>
        </li>
    </ul>

    <div style="display:flex;align-items:center;gap:20px;">

        <!-- Cart -->
        <a href="Cart.html" class="link">
            <i class="fa-solid fa-cart-shopping"></i>
            Cart (<span id="cartCount">0</span>)
        </a>

        <!-- Login Button -->
        <button id="authBtn" onclick="handleAuth()">
            <i class="fa-regular fa-circle-user"></i>
            <span id="authText">Login</span>
        </button>

        <!-- Hamburger -->
        <div class="menu-container" id="menuContainer" style="display:none;">

            <button type="button" id="menuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="dropdown-menu" id="dropdownMenu">

                <a href="MyOrders.html">
                    <i class="fa-solid fa-box"></i> My Orders
                </a>

                <a href="Cart.html">
                    <i class="fa-solid fa-cart-shopping"></i> My Cart
                </a>

                <a href="User.html">
                    <i class="fa-solid fa-user"></i> Profile
                </a>

                <a href="index.html" onclick="logoutUser(event)">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>

            </div>
        </div>

    </div>
</nav>

    <!-- Home Section -->
    <div class="main">

        <div>
            <p style="font-weight:bold; font-size:30px;">
                Home
            </p>

            <p style="font-size:20px;">
                Welcome user and start to purchase
            </p>

            <button class="click">
                <a href="Products.html">Go to Products</a>
            </button>
        </div>

    </div>

    <!-- Products Section -->
    <div class="home-products">

        <p style="display:flex; justify-content:center; font-weight:bold; font-size:30px;">
            Products
        </p>

        <!-- Dynamic Product List -->
        <div class="product-flex" id="productList">
            <!-- Products will be displayed here using JavaScript -->
        </div>

        <!-- Product Template -->
        <template id="productTemplate">
            <div class="dynamic-product">

                <img src="" alt="Product" class="product-image" style="cursor:pointer;">

                <p class="category"></p>

                <p class="title" style="cursor:pointer;"></p>

                <div class="price-row">
    <p class="price"></p>
    <p class="original-price"></p>
</div>

                <div class="product-btn">

                    <button class="cart" type="button">
                    <i class="fa-solid fa-cart-shopping"></i> Add to Cart
                    </button>

                    <button class="buy" type="button">
                    <i class="fa-solid fa-basket-shopping"></i> Buy Now
                    </button>

                </div>

            </div>
        </template>

        <!-- Explore More Button -->
        <div style="display:flex; justify-content:center; padding:8px;">

            <button class="explore">
                <a href="Products.html" class="link">
                    Explore More
                </a>
            </button>

        </div>

    </div>

    <!-- Footer -->
    <div class="footer">

        <p style="font-weight:bold;">
            ProductWorld
        </p>

        <p>Purchase and enjoy</p>

        <p>2026 All rights reserved</p>

    </div>

    <!-- JavaScript -->
    <script src="./config.js"></script>
    <script src="./script.js"></script>
    <script src="https://kit.fontawesome.com/8872bf04b0.js" crossorigin="anonymous"></script>

</body>

</html>
