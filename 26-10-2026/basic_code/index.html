<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/ico" href="./logo/favicon.ico">

    <title>ProductWorld</title>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div style="display:flex; justify-content:center; align-items:center; gap:10px;">
            <img src="./logo/favicon.ico" alt="ProductWorld Logo">

            <p style="font-family:cursive; font-weight:bold;">
                <a href="index.html" class="link" style="color:black;">
                    ProductWorld
                </a>
            </p>
        </div>

        <ul>
            <li class="list">
                <a href="index.html" class="link">
                    Home
                </a>
            </li>

            <li class="list">
                <a href="Products.html" class="link">Products</a>
            </li>

            <li class="list">
                <a href="Contact.html" class="link">Contact</a>
            </li>
        </ul>

        <div style="display: flex;justify-content: center; align-items: center; gap:10px;">
                        <p><a href="./Cart.html" class="link" style="color:black"><i class="fa-solid fa-cart-shopping"></i>
                    Cart(<span id="cartCount">0</span>)</a></p>
              <button class="adminbtn" onclick="openAdmin()" style="display: flex;justify-content: center; align-items: center; gap:10px;"> <i class="fa-regular fa-circle-user"></i> Admin</button>
        </div>

    </nav>

    <!-- Home Section -->
    <div class="main">

        <div>
            <p style="font-weight:bold; font-size:30px;">
                Home
            </p>

            <p style="font-size:20px;">
                Welcome user and start to purchase
            </p>

            <button class="click">
                <a href="Products.html">Go to Products</a>
            </button>
        </div>

    </div>

    <!-- Products Section -->
    <div class="home-products">

        <p style="display:flex; justify-content:center; font-weight:bold; font-size:30px;">
            Products
        </p>

        <!-- Dynamic Product List -->
        <div class="product-flex" id="productList">
            <!-- Products will be displayed here using JavaScript -->
        </div>

        <!-- Product Template -->
        <template id="productTemplate">

            <div class="dynamic-product">

                <img src="" alt="Product" width="200" height="200">

                <p class="category"></p>

                <p class="title"></p>

                <p class="price"></p>

                <div class="product-btn">

                    <button class="cart" type="button">
                        Add to Cart
                    </button>

                    <button class="buy" type="button">
                        Buy Now
                    </button>

                </div>

            </div>

        </template>

        <!-- Explore More Button -->
        <div style="display:flex; justify-content:center; padding:8px;">

            <button class="explore">
                <a href="Products.html" class="link">
                    Explore More
                </a>
            </button>

        </div>

    </div>

    <!-- Footer -->
    <div class="footer">

        <p style="font-weight:bold;">
            ProductWorld
        </p>

        <p>Purchase and enjoy</p>

        <p>2026 All rights reserved</p>

    </div>

    <!-- JavaScript -->
    <script src="./config.js"></script>
    <script src="./script.js"></script>
       <script src="https://kit.fontawesome.com/8872bf04b0.js" crossorigin="anonymous"></script>

</body>

</html>
