     <section class="feedback-container">
 <h2>Feedback</h2>
    <div class="feedback-header">
        <h3>Customer Feedback</h3>
        <span id="feedbackCount">0 Feedbacks</span>
    </div>

    <div class="feedback-table">

        <div class="feedback-heading">
            <span>Name</span>
            <span>Email</span>
            <span>Message</span>
            <span>Action</span>
        </div>

        <div id="feedbackList">

            <!-- Feedback displayed using JavaScript -->

        </div>

        <template id="feedbackTemplate">

            <div class="feedback-row">

                <p class="feedback-name"></p>

                <p class="feedback-email"></p>

                <p class="feedback-message"></p>

                <div class="feedback-actions">
                    <button type="button" class="feedback-delete">
                        Delete
                    </button>
                </div>

            </div>

        </template>

    </div>

</section>
